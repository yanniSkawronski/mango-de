# ============================================================================
#  Clavier, souris, trackpad
# ============================================================================

# Clavier (agencement français ; noms de touches : sortie de `xev` / `wev`)
xkb_rules_layout=fr
repeat_rate=30
repeat_delay=500
numlock_on=0

# Trackpad (certaines options nécessitent une reconnexion)
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# Souris
mouse_natural_scrolling=0
