# ============================================================================
#  Règles de fenêtres et de couches (layer shell)
# ============================================================================

# Fenêtres flottantes par défaut
window_rule=app_id:mpv,is_floating:1
window_rule=app_id:pavucontrol,is_floating:1
window_rule=app_id:firefox,title:Picture-in-Picture,is_floating:1
window_rule=app_id:org.telegram.desktop,title:Media viewer,is_floating:1

# Exemple : envoyer une app sur un tag précis
# window_rule=app_id:spotify,tags:9

# Règles de couche (barres, lanceurs...)
layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=animation_type_close:zoom,layer_name:rofi
