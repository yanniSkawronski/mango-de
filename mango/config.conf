# ============================================================================
#  Environnement de bureau MangoWM — configuration principale
#
#  Valider cette configuration SANS lancer le compositeur :
#      mango -c ~/.config/mango/config.conf -p
#  (ne nécessite ni écran ni session Wayland : la config est parsée puis
#   le processus quitte avec 0 si OK, 1 sinon)
# ============================================================================

# --- Variables d'environnement posées au démarrage de la session ---
env=XDG_SESSION_TYPE,wayland
env=XDG_SESSION_DESKTOP,mango
env=XDG_CURRENT_DESKTOP,wlroots
env=MOZ_ENABLE_WAYLAND,1
env=QT_QPA_PLATFORM,wayland;xcb
env=SDL_VIDEODRIVER,wayland
env=_JAVA_AWT_WM_NONREPARENTING,1

# --- Variables de configuration réutilisables ($var ou ${var}) ---
var=term,foot
var=launcher,rofi -show drun
var=editor,nvim
var=browser,firefox
var=files,nautilus
var=screenshot_dir,~/Pictures/Screenshots

# --- Sous-fichiers (chemins relatifs au fichier qui les inclut) ---
source=./theme.conf
source=./layout.conf
source=./input.conf
source=./rules.conf
source=./bind.conf

# --- Autostart : exécuté une seule fois au lancement de mango ---
exec_once=bash ~/.config/mango/autostart.sh
