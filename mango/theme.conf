# ============================================================================
#  Thème / apparence : flou, ombres, animations, gaps, bordures, couleurs
# ============================================================================

# Flou (via scenefx)
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=8
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2

# Ombres
shadows=1
layer_shadows=1
shadow_only_floating=1
shadows_size=12
shadows_blur=18
shadows_position_x=0
shadows_position_y=0
shadows_color=0x000000ff

# Coins arrondis / opacité
border_radius=8
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=0.85

# Assombrissement des fenêtres non focusées (0 = désactivé)
dim_enable=0
dim_focused_color=0x00000000
dim_unfocused_color=0x00000055

# Animations (type: zoom, slide)
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=zoom
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.3
zoom_end_ratio=1.0
fade_in_begin_opacity=0.6
fade_out_begin_opacity=0.8
animation_duration_move=300
animation_duration_open=250
animation_duration_tag=200
animation_duration_close=200
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.46,1.0,0.29,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Gaps et bordures
gap_inner_horizontal=6
gap_inner_vertical=6
gap_outer_horizontal=12
gap_outer_vertical=12
border_px=2

# Palette (thème sombre, style Catppuccin Mocha)
root_color=0x1e1e2eff
border_color=0x45475aff
focus_color=0xcba6f7ff
drop_color=0x8FBA7C55
split_color=0xEB441EFF
maximized_screen_color=0x89aa61ff
urgent_color=0xf38ba8ff
scratchpad_color=0x516c93ff
global_color=0xb153a7ff
overlay_color=0x14a57cff

# Divers
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
no_border_when_single=0
cursor_size=24
